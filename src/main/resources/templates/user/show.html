<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
    <head>
        <div th:replace="~{fragment :: meta}"></div>   
             
        <div th:replace="~{fragment :: styles}"></div>
        
        <title>会員詳細</title>       
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>
            
            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row justify-content-center">
                        <div class="col-xxl-9 col-xl-10 col-lg-11">
                            
                            <!-- パンくずリスト -->
                            <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">会員一覧</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">会員詳細</li>
                                </ol>
                            </nav>

                            <h1 class="mb-4 text-center">会員詳細</h1>
                            
                            <div class="container mb-4">
                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">ID</div>
                                    <div class="col-8" th:text="${user.getId()}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">氏名</div>
                                    <div class="col-8" th:text="${user.getName()}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">フリガナ</div>
                                    <div class="col-8" th:text="${user.getFurigana()}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">郵便番号</div>
                                    <div class="col-8" th:text="${user.getPostalCode()}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">住所</div>
                                    <div class="col-8" th:text="${user.getAddress()}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">電話番号</div>
                                    <div class="col-8" th:text="${user.getPhoneNumber()}"></div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4 font-weight-bold">メールアドレス</div>
                                    <div class="col-8" th:text="${user.getEmail()}"></div>
                                </div>
                            </div>
                            
                            <div class="text-center">
                                <a th:href="@{/admin/users}" class="btn text-white shadow-sm moattravel-btn">会員一覧に戻る</a>
                            </div>

                        </div>
                    </div>
                </div>
            </main>
            
            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>    
        
        <div th:replace="~{fragment :: scripts}"></div>  
    </body>
</html>
