<!DOCTYPE html>
<html xmlns:th="[https://www.thymeleaf.org](https://www.thymeleaf.org)" xmlns:sec="[http://www.thymeleaf.org/extras/spring-security](http://www.thymeleaf.org/extras/spring-security)">
    <head>
        <div th:replace="~{fragment :: meta}"></div>   
        <div th:replace="~{fragment :: styles}"></div>
        
        <title>ログイン</title>   
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>
            
            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row justify-content-center">
                        <div class="col-xl-3 col-lg-4 col-md-5 col-sm-7">
                            <h1 class="mb-4 text-center">ログイン</h1>            
                            
                            <!-- ログインエラー時のメッセージ -->
                            <div th:if="${param.error}" class="alert alert-danger">
                                メールアドレスまたはパスワードが正しくありません。
                            </div>
                            
                            <!-- ログアウト完了時のメッセージ -->
                            <div th:if="${param.logout}" class="alert alert-info">
                                ログアウトしました。
                            </div>
                            
                            <form th:action="@{/login}" method="post">
                                <div class="form-group mb-3">
                                    <input type="email" class="form-control" name="username" placeholder="メールアドレス" required autofocus autocomplete="email">
                                </div>
                                <div class="form-group mb-3">
                                    <input type="password" class="form-control" name="password" placeholder="パスワード" required autocomplete="current-password">
                                </div>
                                
                                <div class="form-group d-flex justify-content-center my-4">
                                    <button type="submit" class="btn text-white shadow-sm w-100 moattravel-btn">ログイン</button>
                                </div>
                            </form>
                            
                            <div class="text-center">
                                <a th:href="@{/signup}">会員登録</a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div th:replace="~{fragment :: footer}"></div>
        </div>
        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>
