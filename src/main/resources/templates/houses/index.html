<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
    <head>
        <div th:replace="~{fragment :: meta}"></div>   
             
        <div th:replace="~{fragment :: styles}"></div>
        
        <title>民宿一覧</title>       
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>
            
            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row">
                        <!-- 左カラム：検索フォームエリア（幅 3 / 12） -->
                        <div class="col-lg-3 mb-4">
                            <!-- キーワードから探す -->
                            <div class="card mb-3">
                                <div class="card-header fw-bold">キーワードから探す</div>
                                <div class="card-body">
                                    <form method="get" th:action="@{/houses}" class="w-100">
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="民宿名・目的地">
                                            <input type="hidden" name="area" th:value="${area}">
                                            <input type="hidden" name="price" th:value="${price}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <button type="submit" class="btn text-white shadow-sm moattravel-btn">検索</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <!-- エリアから探す -->
                            <div class="card mb-3">
                                <div class="card-header fw-bold">エリアから探す</div>
                                <div class="card-body">
                                    <form method="get" th:action="@{/houses}" class="w-100">
                                        <div class="form-group mb-3">
                                            <select class="form-select" name="area">
                                                <option value="" th:selected="${area == null || area == ''}">選択してください</option>
                                                <option value="北海道" th:selected="${area == '北海道'}">北海道</option>
                                                <option value="東京都" th:selected="${area == '東京都'}">東京都</option>
                                                <option value="京都府" th:selected="${area == '京都府'}">京都府</option>
                                                <option value="大阪府" th:selected="${area == '大阪府'}">大阪府</option>
                                                <option value="沖縄県" th:selected="${area == '沖縄県'}">沖縄県</option>
                                            </select>
                                        </div>
                                        <input type="hidden" name="keyword" th:value="${keyword}">
                                        <input type="hidden" name="price" th:value="${price}">
                                        <input type="hidden" name="sort" th:value="${sort}">
                                        <div class="form-group">
                                            <button type="submit" class="btn text-white shadow-sm w-100 moattravel-btn">検索</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <!-- 1泊あたりの予算から探す -->
                            <div class="card mb-3">
                                <div class="card-header fw-bold">1泊あたりの予算から探す</div>
                                <div class="card-body">
                                    <form method="get" th:action="@{/houses}" class="w-100">
                                        <div class="form-group mb-3">
                                            <select class="form-select" name="price">
                                                <option value="" th:selected="${price == null}">選択してください</option>
                                                <option value="6000" th:selected="${price == 6000}">6,000円以内</option>
                                                <option value="7000" th:selected="${price == 7000}">7,000円以内</option>
                                                <option value="8000" th:selected="${price == 8000}">8,000円以内</option>
                                                <option value="9000" th:selected="${price == 9000}">9,000円以内</option>
                                                <option value="10000" th:selected="${price == 10000}">10,000円以内</option>
                                            </select>
                                        </div>
                                        <input type="hidden" name="keyword" th:value="${keyword}">
                                        <input type="hidden" name="area" th:value="${area}">
                                        <input type="hidden" name="sort" th:value="${sort}">
                                        <div class="form-group">
                                            <button type="submit" class="btn text-white shadow-sm w-100 moattravel-btn">検索</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div><!-- 左カラム終了 -->

                        <!-- 右カラム：民宿一覧表示エリア（幅 9 / 12） -->
                        <div class="col-lg-9">
                            <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
                                <!-- 条件分岐を安全に修正 -->
                                <div th:if="${keyword != null and keyword != ''}">
                                    「<span th:text="${keyword}"></span>」の検索結果：<span th:text="${housePage.getTotalElements()}"></span>件
                                </div>
                                <div th:if="${area != null and area != ''}">
                                    「<span th:text="${area}"></span>」の検索結果：<span th:text="${housePage.getTotalElements()}"></span>件
                                </div>
                                <div th:if="${price != null}">
                                    「<span th:text="${price}"></span>円以内」の検索結果：<span th:text="${housePage.getTotalElements()}"></span>件
                                </div>
                                <div th:if="${(keyword == null or keyword == '') and (area == null or area == '') and (price == null)}">
                                    全件：<span th:text="${housePage.getTotalElements()}"></span>件
                                </div>

                                <!-- 並び替えセレクトボックス -->
                                <form method="get" th:action="@{/houses}" class="mb-2 mb-md-0">
                                    <input type="hidden" name="keyword" th:value="${keyword}">
                                    <input type="hidden" name="area" th:value="${area}">
                                    <input type="hidden" name="price" th:value="${price}">
                                    <select class="form-select form-select-sm" name="sort" onchange="this.form.submit()">
                                        <option value="id,asc" th:selected="${sort == 'id,asc'}">IDが新しい順</option>
                                        <option value="id,desc" th:selected="${sort == 'id,desc'}">IDが古い順</option>
                                        <option value="price,asc" th:selected="${sort == 'price,asc'}">宿泊料金が安い順</option>
                                        <option value="price,desc" th:selected="${sort == 'price,desc'}">宿泊料金が高い順</option>
                                    </select>
                                </form>
                            </div>
                            
                            <div th:if="${successMessage}" class="alert alert-info">
                                <span th:text="${successMessage}"></span>
                            </div>                            

                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col" style="width: 20%;">民宿画像</th>
                                        <th scope="col">ID</th>
                                        <th scope="col">民宿名</th>
                                        <th scope="col">郵便番号</th>
                                        <th scope="col">住所</th>
                                        <th scope="col">電話番号</th>
                                        <th scope="col"></th>
                                    </tr>
                                </thead>
                                <tbody>                                                     
                                    <tr th:each="house : ${housePage}">
                                        <td>
                                            <img th:if="${house.getImageName()}" th:src="@{/storage/__${house.getImageName()}__}" class="img-fluid w-100" alt="民宿の画像">
                                            <img th:unless="${house.getImageName()}" th:src="@{/images/no-image.png}" class="img-fluid w-100" alt="NO IMAGE">
                                        </td>
                                        <td th:text="${house.getId()}"></td>
                                        <td th:text="${house.getName()}"></td>
                                        <td th:text="${house.getPostalCode()}"></td>
                                        <td th:text="${house.getAddress()}"></td>
                                        <td th:text="${house.getPhoneNumber()}"></td>
                                        <td><a th:href="@{/houses/__${house.getId()}__}">詳細</a></td>                                        
                                    </tr>                                      
                                </tbody>
                            </table>
                            
                            <!-- ページネーション -->
                            <div th:if="${housePage.getTotalPages() > 1}" class="d-flex justify-content-center">
                                <nav aria-label="民宿一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item">
                                            <span th:if="${housePage.isFirst()}" class="page-link disabled">前</span>
                                            <a th:unless="${housePage.isFirst()}" th:href="@{/houses(page = ${housePage.getNumber() - 1}, keyword = ${keyword}, area = ${area}, price = ${price}, sort = ${sort})}" class="page-link moattravel-page-link">前</a>
                                        </li>
                                        <li th:each="i : ${#numbers.sequence(0, housePage.getTotalPages() - 1)}" class="page-item">
                                            <span th:if="${i == housePage.getNumber()}" class="page-link active moattravel-active" th:text="${i + 1}"></span>
                                            <a th:unless="${i == housePage.getNumber()}" th:href="@{/houses(page = ${i}, keyword = ${keyword}, area = ${area}, price = ${price}, sort = ${sort})}" class="page-link moattravel-page-link" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item">
                                            <span th:if="${housePage.isLast()}" class="page-link disabled">次</span>
                                            <a th:unless="${housePage.isLast()}" th:href="@{/houses(page = ${housePage.getNumber() + 1}, keyword = ${keyword}, area = ${area}, price = ${price}, sort = ${sort})}" class="page-link moattravel-page-link">次</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>                                                                                                
                        </div><!-- 右カラム終了 -->
                    </div><!-- row終了 -->
                </div>
            </main>
            
            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>    
        
        <div th:replace="~{fragment :: scripts}"></div>  
    </body>
</html>
