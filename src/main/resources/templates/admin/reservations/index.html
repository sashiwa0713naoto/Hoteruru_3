<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>   
             
        <div th:replace="~{fragment :: styles}"></div>
        
        <title>予約一覧</title>       
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>
            
            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row justify-content-center">
                        <div class="col-xxl-9 col-xl-10 col-lg-11">
                            
                            <!-- パンくずリスト -->
                            <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item"><a th:href="@{/admin/houses}">民宿一覧</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">予約一覧</li>
                                </ol>
                            </nav>

                            <h1 class="mb-4 text-center">予約一覧</h1>

                            <!-- 予約一覧テーブル -->
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">民宿名</th>
                                        <th scope="col">宿泊者名</th>
                                        <th scope="col">チェックイン</th>
                                        <th scope="col">チェックアウト</th>
                                        <th scope="col">宿泊人数</th>
                                        <th scope="col">料金</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="reservation : ${reservationPage}">
                                        <td th:text="${reservation.id}"></td>
                                        <td th:text="${reservation.house.name}"></td>
                                        <td th:text="${reservation.user.name}"></td>
                                        <td th:text="${reservation.checkinDate}"></td>
                                        <td th:text="${reservation.checkoutDate}"></td>
                                        <td th:text="${reservation.numberOfPeople + '名'}"></td>
                                        <td th:text="${#numbers.formatInteger(reservation.amount, 1, 'COMMA') + '円'}"></td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- ページネーション -->
                            <div th:if="${reservationPage.getTotalPages() > 1}" class="d-flex justify-content-center">
                                <nav aria-label="予約一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item">
                                            <span th:if="${reservationPage.isFirst()}" class="page-link disabled">前</span>
                                            <a th:unless="${reservationPage.isFirst()}" th:href="@{/admin/reservations(page = ${reservationPage.getNumber() - 1})}" class="page-link moattravel-page-link">前</a>
                                        </li>
                                        <li th:each="i : ${#numbers.sequence(0, reservationPage.getTotalPages() - 1)}" class="page-item">
                                            <span th:if="${i == reservationPage.getNumber()}" class="page-link active moattravel-active" th:text="${i + 1}"></span>
                                            <a th:unless="${i == reservationPage.getNumber()}" th:href="@{/admin/reservations(page = ${i})}" class="page-link moattravel-page-link" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item">
                                            <span th:if="${reservationPage.isLast()}" class="page-link disabled">次</span>
                                            <a th:unless="${reservationPage.isLast()}" th:href="@{/admin/reservations(page = ${reservationPage.getNumber() + 1})}" class="page-link moattravel-page-link">次</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>

                        </div>
                    </div>
                </div>
            </main>
            
            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>    
        
        <div th:replace="~{fragment :: scripts}"></div>  
    </body>
</html>
