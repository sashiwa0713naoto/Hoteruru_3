<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>

        <div th:replace="~{fragment :: styles}"></div>

        <title>会員一覧</title>
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>

            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row">
                        <div class="col-xxl-9 col-xl-10 col-lg-11 mx-auto">
                            <h1 class="mb-4 text-center">会員一覧</h1>

                            <div class="d-flex justify-content-between align-items-end flex-wrap mb-3">
                                <form method="get" th:action="@{/admin/users}" class="moattravel-search-box mb-3">
                                    <div class="input-group">
                                        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="氏名・フリガナ">
                                        <button type="submit" class="btn text-white shadow-sm moattravel-btn">検索</button>
                                    </div>
                                </form>
                            </div>

                            <div th:if="${successMessage}" class="alert alert-info" role="alert">
                                <span th:text="${successMessage}"></span>
                            </div>

                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">氏名</th>
                                        <th scope="col">フリガナ</th>
                                        <th scope="col">メールアドレス</th>
                                        <th scope="col"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.getId()}"></td>
                                        <td th:text="${user.getName()}"></td>
                                        <td th:text="${user.getFurigana()}"></td>
                                        <td th:text="${user.getEmail()}"></td>
                                        <td><a th:href="@{/admin/users/__${user.getId()}__}">詳細</a></td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- ページネーション -->
                            <div th:if="${users.getTotalPages() > 1}" class="d-flex justify-content-center">
                                <nav aria-label="会員一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item">
                                            <a th:if="${users.hasPrevious()}" th:href="@{/admin/users(page = ${users.getNumber() - 1}, keyword = ${keyword})}" class="page-link moattravel-page-link">前</a>
                                            <span th:unless="${users.hasPrevious()}" class="page-link disabled">前</span>
                                        </li>
                                        <li th:each="i : ${#numbers.sequence(0, users.getTotalPages() - 1)}" class="page-item">
                                            <a th:if="${i == users.getNumber()}" th:href="@{/admin/users(page = ${i}, keyword = ${keyword})}" class="page-link text-white moattravel-active" th:text="${i + 1}"></a>
                                            <a th:unless="${i == users.getNumber()}" th:href="@{/admin/users(page = ${i}, keyword = ${keyword})}" class="page-link moattravel-page-link" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item">
                                            <a th:if="${users.hasNext()}" th:href="@{/admin/users(page = ${users.getNumber() + 1}, keyword = ${keyword})}" class="page-link moattravel-page-link">次</a>
                                            <span th:unless="${users.hasNext()}" class="page-link disabled">次</span>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>

        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>
