<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
    <head>
        <div th:replace="~{fragment :: meta}"></div>   
        <div th:replace="~{fragment :: styles}"></div>
        <title>会員情報編集</title>       
    </head>
    <body>
        <div class="moattravel-wrapper">
            <div th:replace="~{fragment :: header}"></div>
            
            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row justify-content-center">
                        <div class="col-xl-5 col-lg-6 col-md-8">
                            <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">会員一覧</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/admin/users/__${user.id}__}">会員詳細</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">会員情報編集</li>
                                </ol>
                            </nav>

                            <h1 class="mb-4 text-center">会員情報編集</h1>
                            
                            <form method="post" th:action="@{/admin/users/__${user.id}__/update}" th:object="${userEditForm}">
                                <input type="hidden" th:field="*{id}">
                                
                                <div class="form-group row mb-3">
                                    <label class="col-md-5 col-form-label text-md-left fw-bold">氏名</label>
                                    <div class="col-md-7">
                                        <div th:if="${#fields.hasErrors('name')}" class="text-danger small mb-1" th:errors="*{name}"></div>
                                        <input type="text" class="form-control" th:field="*{name}">
                                    </div>
                                </div>

                                <div class="form-group row mb-3">
                                    <label class="col-md-5 col-form-label text-md-left fw-bold">フリガナ</label>
                                    <div class="col-md-7">
                                        <div th:if="${#fields.hasErrors('furigana')}" class="text-danger small mb-1" th:errors="*{furigana}"></div>
                                        <input type="text" class="form-control" th:field="*{furigana}">
                                    </div>
                                </div>

                                <div class="form-group row mb-3">
                                    <label class="col-md-5 col-form-label text-md-left fw-bold">郵便番号</label>
                                    <div class="col-md-7">
                                        <div th:if="${#fields.hasErrors('postalCode')}" class="text-danger small mb-1" th:errors="*{postalCode}"></div>
                                        <input type="text" class="form-control" th:field="*{postalCode}">
                                    </div>
                                </div>

                                <div class="form-group row mb-3">
                                    <label class="col-md-5 col-form-label text-md-left fw-bold">住所</label>
                                    <div class="col-md-7">
                                        <div th:if="${#fields.hasErrors('address')}" class="text-danger small mb-1" th:errors="*{address}"></div>
                                        <input type="text" class="form-control" th:field="*{address}">
                                    </div>
                                </div>

                                <div class="form-group row mb-3">
                                    <label class="col-md-5 col-form-label text-md-left fw-bold">電話番号</label>
                                    <div class="col-md-7">
                                        <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger small mb-1" th:errors="*{phoneNumber}"></div>
                                        <input type="text" class="form-control" th:field="*{phoneNumber}">
                                    </div>
                                </div>

                                <div class="form-group row mb-3">
                                    <label class="col-md-5 col-form-label text-md-left fw-bold">メールアドレス</label>
                                    <div class="col-md-7">
                                        <div th:if="${#fields.hasErrors('email')}" class="text-danger small mb-1" th:errors="*{email}"></div>
                                        <input type="email" class="form-control" th:field="*{email}">
                                    </div>
                                </div>

                                <div class="form-group d-flex justify-content-center my-4">
                                    <button type="submit" class="btn text-white shadow-sm w-50 moattravel-btn">更新</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
            <div th:replace="~{fragment :: footer}"></div>
        </div>    
        <div th:replace="~{fragment :: scripts}"></div>  
    </body>
</html>
