<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>   
             
        <div th:replace="~{fragment :: styles}"></div>
        
        <title>会員詳細</title>       
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>
            
            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row justify-content-center">
                        <div class="col-xl-5 col-lg-6 col-md-8">
                            
                            <!-- パンくずリスト -->
                            <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">会員一覧</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">会員詳細</li>
                                </ol>
                            </nav>

                            <h1 class="mb-4 text-center">会員詳細</h1>

                            <!-- 成功メッセージ -->
                            <div th:if="${successMessage}" class="alert alert-info">
                                <span th:text="${successMessage}"></span>
                            </div>

                            <!-- 会員詳細情報 -->
                            <div class="container mb-4">
                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">ID</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.id}"></span>
                                    </div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">氏名</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.name}"></span>
                                    </div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">フリガナ</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.furigana}"></span>
                                    </div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">郵便番号</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.postalCode}"></span>
                                    </div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">住所</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.address}"></span>
                                    </div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">電話番号</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.phoneNumber}"></span>
                                    </div>
                                </div>

                                <div class="row pb-2 mb-2 border-bottom">
                                    <div class="col-4">
                                        <span class="fw-bold">メールアドレス</span>
                                    </div>
                                    <div class="col-8">
                                        <span th:text="${user.email}"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- 操作ボタンエリア（重複を解消） -->
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/admin/users/__${user.id}__/edit}" class="btn text-white shadow-sm moattravel-btn me-2">編集</a>
                                
                                <form method="post" th:action="@{/admin/users/__${user.id}__/delete}" onsubmit="return confirm('本当にこの会員を削除しますか？');" class="d-inline me-2">
                                    <button type="submit" class="btn btn-danger text-white shadow-sm">削除</button>
                                </form>
                                
                                <a th:href="@{/admin/users}" class="btn btn-secondary shadow-sm">会員一覧に戻る</a>
                            </div>

                        </div>
                    </div>
                </div>
            </main>
            
            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>    
        
        <div th:replace="~{fragment :: scripts}"></div>  
    </body>
</html>
