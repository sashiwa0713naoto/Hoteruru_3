<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>

        <div th:replace="~{fragment :: styles}"></div>

        <title>民宿一覧</title>
    </head>
    <body>
        <div class="moattravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>

            <main>
                <div class="container pt-4 pb-5 moattravel-container">
                    <div class="row">
                        <div class="col-xxl-9 col-xl-10 col-lg-11 mx-auto">
                            <h1 class="mb-4 text-center">民宿一覧</h1>

                            <div class="d-flex justify-content-between align-items-end flex-wrap mb-3">
                                <form method="get" th:action="@{/admin/houses}" class="moattravel-search-box mb-3">
                                    <div class="input-group">
                                        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="民宿名">
                                        <button type="submit" class="btn text-white shadow-sm moattravel-btn">検索</button>
                                    </div>
                                </form>

                                <a th:href="@{/admin/houses/register}" class="btn text-white shadow-sm mb-3 moattravel-btn">登録</a>
                            </div>

                            <div th:if="${successMessage}" class="alert alert-info" role="alert">
                                <span th:text="${successMessage}"></span>
                            </div>

                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">民宿名</th>
                                        <th scope="col">郵便番号</th>
                                        <th scope="col">住所</th>
                                        <th scope="col">電話番号</th>
                                        <th scope="col"></th>
                                        <th scope="col"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="house : ${houses}">
                                        <td th:text="${house.getId()}"></td>
                                        <td th:text="${house.getName()}"></td>
                                        <td th:text="${house.getPostalCode()}"></td>
                                        <td th:text="${house.getAddress()}"></td>
                                        <td th:text="${house.getPhoneNumber()}"></td>
										<td><a th:href="@{/admin/houses/__${house.getId()}__}">詳細</a></td>
										<td><a th:href="@{/admin/houses/__${house.getId()}__/edit}">編集</a></td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- ページネーション -->
                            <div th:if="${houses.getTotalPages() > 1}" class="d-flex justify-content-center">
                                <nav aria-label="民宿一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item">
                                            <a th:if="${houses.hasPrevious()}" th:href="@{/admin/houses(page = ${houses.getNumber() - 1}, keyword = ${keyword})}" class="page-link moattravel-page-link">前</a>
                                            <span th:unless="${houses.hasPrevious()}" class="page-link disabled">前</span>
                                        </li>
                                        <li th:each="i : ${#numbers.sequence(0, houses.getTotalPages() - 1)}" class="page-item">
                                            <a th:if="${i == houses.getNumber()}" th:href="@{/admin/houses(page = ${i}, keyword = ${keyword})}" class="page-link text-white moattravel-active" th:text="${i + 1}"></a>
                                            <a th:unless="${i == houses.getNumber()}" th:href="@{/admin/houses(page = ${i}, keyword = ${keyword})}" class="page-link moattravel-page-link" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item">
                                            <a th:if="${houses.hasNext()}" th:href="@{/admin/houses(page = ${houses.getNumber() + 1}, keyword = ${keyword})}" class="page-link moattravel-page-link">次</a>
                                            <span th:unless="${houses.hasNext()}" class="page-link disabled">次</span>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>

        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>
